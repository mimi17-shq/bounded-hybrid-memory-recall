[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-hybrid-memory-recall"
version = "0.1.0"
description = "A bounded Chinese hybrid-recall and source-evidence reference implementation for long-running AI assistants."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mimi" }]
keywords = ["agent-memory", "hybrid-retrieval", "vector-search", "chinese", "provenance"]

[tool.setuptools.packages.find]
where = ["src"]
